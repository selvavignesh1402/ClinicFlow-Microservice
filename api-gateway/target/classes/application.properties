spring.cloud.gateway.server.webflux.routes[10].id=billing-service-finance
spring.cloud.gateway.server.webflux.routes[10].uri=lb://billing-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/finance/**

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.server=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,gateway
management.info.env.enabled=true