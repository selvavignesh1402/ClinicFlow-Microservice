spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/clinician/encounters/**

spring.cloud.gateway.server.webflux.routes[5].id=clinical-service-prescriptions
spring.cloud.gateway.server.webflux.routes[5].uri=lb://clinical-service
