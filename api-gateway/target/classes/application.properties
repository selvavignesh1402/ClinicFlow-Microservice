spring.application.name=api-gateway
server.port=8080

# CORS Configuration
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Origin,Content-Type,Accept,Authorization,X-Requested-With
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Gateway Route Definitions
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=auth-service-admin
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/admin/**

spring.cloud.gateway.server.webflux.routes[2].id=patient-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://patient-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/patients/**

